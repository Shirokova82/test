function start(data){if(!data?.ok||!data.plan||!data.prices)throw Error('Некорректные данные плана');src=data.plan;prices=data.prices;
 if(!Array.isArray(src.stages)||src.stages.length!==3)throw Error('Неверное число этапов');src.stages.forEach(s=>{s.count=Math.min(12,Math.max(0,Number(s.count)||0));s.physio=Math.min(20,Math.max(0,Number(s.physio)||0));s.minutes=[30,60,90].includes(Number(s.minutes))?Number(s.minutes):60});state=defaultState();
 $('loading').hidden=true;$('app').hidden=false;$('goal').hidden=!src.goal;$('goal').textContent=src.goal||'';render();}
 $('stages').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const i=Number(b.dataset.i);if(i<0||i>=3)return;if(b.dataset.min){state.stages[i].minutes=Number(b.dataset.min);render()}else if(b.dataset.choose){state.stages[i].payment.selected=b.dataset.choose;render()}});
 $('stages').addEventListener('input',e=>{const el=e.target;if(el.dataset.k){const i=Number(el.dataset.i);state.stages[i][el.dataset.k]=Number(el.value);const value=el.closest('.field')?.querySelector('.fieldLabel b');if(value)value.textContent=el.value;}});
 $('stages').addEventListener('change',e=>{const el=e.target;if(el.dataset.offer){const i=Number(el.dataset.i),id=el.dataset.offer,p=state.stages[i].payment;p.offered=el.checked?ids.filter(x=>p.offered.includes(x)||x===id):p.offered.filter(x=>x!==id);normalizePayment(state.stages[i],state.tier);render()}else if(el.dataset.phys){state.stages[Number(el.dataset.i)].physOn=el.checked;render()}else if(el.dataset.k){render()}});
