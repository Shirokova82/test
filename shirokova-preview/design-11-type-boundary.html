:root{--white:#F8FAFA;--teal:#21A9AC;--soft:#50A8AA;--sea:#07516A;--sea2:#107080;--pale:#DDEFF0;--blue:#06376B}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--white);overflow-x:hidden}
body{color:var(--sea);font-family:'BrandDroid',sans-serif}a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}a:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:4px}
.shell{display:grid;grid-template-columns:clamp(164px,13.2vw,204px) minmax(0,1fr);min-height:100svh}
.sidebar{height:100svh;position:sticky;top:0;border-right:1px solid var(--pale);padding:24px 22px 28px;display:flex;flex-direction:column;z-index:10;background:var(--white)}
.brand{width:93px;max-width:100%;height:auto;display:block}
.nav{display:flex;flex-direction:column;gap:21px;align-items:flex-start;margin:auto 0 10vh}
.nav a{font:400 clamp(26px,2.4vw,36px)/.94 'BrandDroid',sans-serif;transition:color .25s,transform .25s}
.nav a:hover{color:var(--teal);transform:translateX(5px)}
.stage{height:100svh;min-height:610px;min-width:0;position:relative;overflow:hidden;background:var(--white);isolation:isolate}
/* Word crosses a color plane; its ink reverses as it enters the turquoise field */
.letter-field{position:absolute;z-index:0;inset:0 0 0 auto;width:52%;background:var(--teal);clip-path:polygon(24% 0,100% 0,100% 100%,0 100%)}
.letter-mask{display:none}
.hero{position:relative;width:100%;height:100%;display:flex;align-items:center;padding:0 clamp(34px,5.5vw,100px)}
.hero-core{position:relative;z-index:3;width:100%;max-width:1280px;display:flex;flex-direction:column;align-items:flex-start;margin:0;transform:translateY(-1vh)}
.intro{font:400 clamp(45px,4.65vw,77px)/.94 'BrandDroid',sans-serif;letter-spacing:0;color:var(--sea);margin:0 0 20px 0;width:max-content;max-width:64%;}
.intro span{display:block}
.statement{display:block;width:100%;margin-top:clamp(45px,8vh,100px);max-width:none}
.predicate{display:block;font:400 clamp(50px,5.8vw,95px)/.94 'BrandDroid',sans-serif;color:var(--sea);margin:0 0 clamp(9px,2vh,30px);white-space:nowrap}
.keyword{font:400 clamp(48px,6.0vw,108px)/.97 'BrandMeloriac',sans-serif;letter-spacing:-.022em;white-space:nowrap;color:var(--sea);display:block;width:max-content;max-width:100%;position:relative;z-index:2;margin:0}
.keyword::after{content:attr(data-text);position:absolute;inset:0;color:var(--white);clip-path:polygon(var(--cut-top,62%) 0,100% 0,100% 100%,var(--cut-bottom,52%) 100%);pointer-events:none}
.mobile-menu-button,.mobile-menu{display:none}
@media(min-width:901px) and (max-width:1250px){.hero{padding-left:4vw;padding-right:4vw}.intro{font-size:4.9vw}.predicate{font-size:5.9vw}.keyword{font-size:5.7vw}}

<script>
(()=>{
 const word=document.querySelector('.keyword'),stage=document.querySelector('.stage'),pane=document.querySelector('.letter-field');
 let raf;
 const update=()=>{
  const rect=stage.getBoundingClientRect();
  const maxWidth=rect.right-word.getBoundingClientRect().left-(innerWidth<=900?19:24);
  let font=parseFloat(getComputedStyle(word).fontSize); const natural=font;
  word.style.fontSize='';font=parseFloat(getComputedStyle(word).fontSize);
  while(word.getBoundingClientRect().width>maxWidth && font>18){font-=.6;word.style.fontSize=font+'px'}
  const r=word.getBoundingClientRect(),p=pane.getBoundingClientRect();
  const fracTop=innerWidth<=900?.92:.24;const fracBottom=0;
  const intersection=(y)=>{const progress=Math.max(0,Math.min(1,(y-p.top)/p.height));return p.left+p.width*(fracTop+(fracBottom-fracTop)*progress)};
  const pct=(x)=>((x-r.left)/r.width*100).toFixed(3)+'%';
  word.style.setProperty('--cut-top',pct(intersection(r.top)));
  word.style.setProperty('--cut-bottom',pct(intersection(r.bottom)));
 };
 window.addEventListener('resize',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(update)});
 document.fonts.ready.then(update);update();
})();
</script></body></html>
