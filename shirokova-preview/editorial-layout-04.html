:root{--paper:#F8FAFA;--ink:#06376B;--sea:#07516A;--jade:#21A9AC;--muted:#50A8AA;--line:#DDEFF0}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}body{font-family:Arial,sans-serif}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
.frame{min-height:100svh;display:grid;grid-template-columns:clamp(188px,16vw,246px) minmax(0,1fr)}
.rail{height:100svh;position:sticky;top:0;padding:31px 24px 30px;display:flex;flex-direction:column;border-right:1px solid var(--line);z-index:4;background:var(--paper)}
.brand{display:block;width:116px;max-width:100%;height:auto;object-fit:contain}
.navigation{margin-top:auto;margin-bottom:auto;padding:80px 0 0;display:flex;flex-direction:column;align-items:flex-start;gap:17px}
.navigation a{font:400 clamp(28px,2.55vw,38px)/1 Droid,sans-serif;position:relative;padding:7px 0;transition:color .25s;white-space:nowrap}
.navigation a:after{content:'';position:absolute;left:0;bottom:4px;width:0;height:2px;background:var(--jade);transition:width .4s ease}
.navigation a:hover{color:var(--jade)}.navigation a:hover:after{width:100%}
.stage{position:relative;min-width:0;min-height:100svh;display:flex;align-items:center;isolation:isolate;overflow:hidden}
.stage:before{content:'';position:absolute;inset:0 0 0 67%;background:var(--line);opacity:.38;z-index:-2}
.hero{position:relative;width:100%;min-height:min(790px,92svh);padding:clamp(36px,4.4vw,80px) clamp(30px,5.1vw,90px);display:flex;flex-direction:column;justify-content:center}
.hero h1{font-weight:400;margin:0;position:relative;display:flex;flex-direction:column;align-items:stretch}
.opening{font:400 clamp(40px,5.15vw,90px)/.96 Droid,sans-serif;letter-spacing:0;align-self:flex-start;white-space:nowrap;position:relative;z-index:2}
.subject{font:400 clamp(93px,13.1vw,225px)/.85 Bebas,sans-serif;align-self:flex-end;white-space:nowrap;margin-top:clamp(14px,2vw,40px);letter-spacing:-.012em;color:var(--sea);position:relative;z-index:1}
