:root{--paper:#F8FAFA;--aqua:#21A9AC;--light-aqua:#50A8AA;--ink:#07516A;--line:#DDEFF0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper)}body{color:var(--ink);font-family:'Droid 1997',sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;color:inherit}a:focus-visible,button:focus-visible{outline:2px solid var(--aqua);outline-offset:5px}
.layout{display:grid;grid-template-columns:clamp(160px,13.4vw,205px) minmax(0,1fr);min-height:100svh}
.sidebar{position:sticky;top:0;height:100svh;min-width:0;padding:27px 22px;display:flex;flex-direction:column;background:var(--paper);border-right:1px solid var(--line);z-index:40}
.logo{width:92px;max-width:100%;height:auto;display:block;object-fit:contain}
.nav{display:flex;flex-direction:column;align-items:flex-start;gap:17px;margin:auto 0 8vh}.nav a{font:400 clamp(29px,2.5vw,40px)/1 'Droid 1997',sans-serif;transition:color .25s}.nav a:hover{color:var(--aqua)}
.stage{position:relative;min-width:0;width:100%;height:100svh;min-height:650px;isolation:isolate;overflow:hidden;background:var(--paper)}
.photo-scene{position:absolute;inset:0;z-index:-1;overflow:hidden;clip-path:inset(0 0 0 0)}
.photo-scene::before{content:'';position:absolute;inset:0;background-image:url('https://static.tildacdn.com/tild6538-6665-4136-b262-376230643162/___.png');background-repeat:no-repeat;background-size:cover;background-position:51% center;will-change:transform;transform-origin:75% 50%}
.photo-scene::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--paper) 0%,transparent 62%);opacity:.10;pointer-events:none}
.editorial{position:absolute;left:clamp(42px,7.3vw,118px);top:49%;transform:translateY(-50%);width:min(710px,54%);z-index:3;pointer-events:none}
.message{margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:0;font-weight:400}
.message .line{display:block;white-space:nowrap;max-width:100%;font-weight:400;position:relative;will-change:transform;transform:translateZ(0)}
.l1{font:400 clamp(54px,5.6vw,89px)/.97 'Droid 1997',sans-serif;color:var(--ink)}
.l2{font:400 clamp(63px,6.7vw,106px)/.93 'Droid 1997',sans-serif;color:var(--aqua);margin-top:3px}
.l3{font:400 clamp(55px,5.5vw,91px)/.99 'Droid 1997',sans-serif;color:var(--ink);margin-top:9px}
.l4{font:400 clamp(59px,5.7vw,92px)/.94 'Bebas Neue',sans-serif;color:var(--ink);margin-top:6px;letter-spacing:0;position:relative}
.l4::after{content:'';height:clamp(4px,.52vw,7px);width:34%;background:var(--aqua);position:absolute;bottom:-.19em;left:0;transform-origin:left center}
.ink-stroke{display:block;width:150px;height:5px;background:var(--aqua);margin-top:12px;transform-origin:left center}.editorial-marker{display:block;position:absolute;left:0;top:-29px;width:56px;height:2px;background:var(--aqua)}
.mobile-menu-button,.mobile-nav{display:none}
@media (min-width:901px) and (max-width:1240px){.editorial{width:56%;left:4.5vw}.l1{font-size:5.5vw}.l2{font-size:6.5vw}.l3{font-size:5.5vw}.l4{font-size:6.2vw}.photo-scene::before{background-position:54% center}}
@media (max-width:900px){
.layout{display:block}.sidebar{height:72px;position:relative;padding:8px 19px;flex-direction:row;align-items:center;justify-content:space-between;border-right:0;border-bottom:1px solid var(--line)}.logo{width:80px}.nav{display:none}
.mobile-menu-button{display:flex;border:0;background:none;gap:6px;padding:8px;flex-direction:column;align-items:flex-end}.mobile-menu-button i{display:block;width:29px;height:2px;background:var(--ink)}.mobile-menu-button i:last-child{width:19px}
.mobile-nav.open{display:flex;position:fixed;inset:72px 0 0;z-index:30;background:var(--paper);flex-direction:column;justify-content:center;gap:22px;padding:27px}.mobile-nav a{font:400 clamp(55px,14vw,84px)/1 'Droid 1997',sans-serif}
.stage{height:calc(100svh - 72px);min-height:550px}
.photo-scene{inset:0;clip-path:inset(0 0 0 0)}
.photo-scene::before{background-image:url('https://static.tildacdn.com/tild3561-3665-4439-a363-393035633463/_____.png');background-size:auto 63%;background-position:calc(50% + 76vw) bottom;transform-origin:35% 70%}
.photo-scene::after{background:none}
.editorial{left:22px;right:22px;width:auto;top:14%;transform:none}
.message .line{white-space:nowrap}
.l1{font-size:clamp(42px,11.4vw,64px);line-height:.95}
.l2{font-size:clamp(53px,14vw,80px);line-height:.94;margin-top:0}

(()=>{const trigger=document.getElementById('menu-trigger'),nav=document.getElementById('mobile-nav');trigger.addEventListener('click',()=>{const on=nav.classList.toggle('open');trigger.setAttribute('aria-expanded',String(on));trigger.setAttribute('aria-label',on?'Закрыть меню':'Открыть меню')});nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{nav.classList.remove('open');trigger.setAttribute('aria-expanded','false')}));
const stage=document.querySelector('.stage'),editorial=document.querySelector('.editorial'),scene=document.querySelector('.photo-scene');let timeline;
function fit(){for(const line of document.querySelectorAll('.message .line')){line.style.fontSize='';const r=document.createRange();r.selectNodeContents(line);const max=innerWidth<=900?stage.clientWidth-44:editorial.clientWidth-6;let font=parseFloat(getComputedStyle(line).fontSize);let guard=0;while(r.getBoundingClientRect().width>max && font>22 && guard++<130){font-=.75;line.style.fontSize=font+'px'}}}
function start(){fit();if(timeline){timeline.kill();gsap.set(['.photo-scene','.photo-scene::before','.message .line','.editorial-marker'],{clearProps:'all'})}
if(matchMedia('(prefers-reduced-motion:reduce)').matches){return}
const photo=scene;timeline=gsap.timeline({paused:true,defaults:{ease:'power3.out'}});
timeline.fromTo(photo,{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',duration:1.45,ease:'power3.inOut'},.05);
timeline.fromTo('.message .line',{opacity:0,y:26,clipPath:'inset(0 0 110% 0)'},{opacity:1,y:0,clipPath:'inset(0 0 0% 0)',duration:.82,stagger:.12,ease:'power3.out'},.48);
timeline.fromTo('.editorial-marker',{scaleX:0},{scaleX:1,duration:.75,ease:'power2.out'},.78);timeline.fromTo('.ink-stroke',{scaleX:0},{scaleX:1,duration:.65,ease:'power2.out'},1.5);
timeline.fromTo('.l4',{color:'#07516A'},{color:'#07516A',duration:.01},2.2);
timeline.to({}, {duration:.12},2.65);
window.__seek=x=>timeline.seek(Math.max(0,Math.min(timeline.duration(),x)));
const t=new URLSearchParams(location.search).get('t');if(t!==null)window.__seek(Number(t));else timeline.play(0)}
document.fonts.ready.then(start);let timer;window.addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(start,180)});
})();
