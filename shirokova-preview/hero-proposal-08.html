@media(max-width:1200px) and (min-width:801px){.hero{padding-left:3.3vw;padding-right:3.3vw}.lead{font-size:5.1vw}.manifest{font-size:7.3vw}.end{font-size:7.1vw}}
@media(max-width:800px){.shell{display:block}.sidebar{height:72px;position:relative;padding:8px 20px;justify-content:center;border-right:0;border-bottom:1px solid var(--mint)}.logo{width:79px}.nav{display:none}.stage{min-height:calc(100svh - 72px)}.stage:before{display:none}.hero{min-height:calc(100svh - 72px);padding:10vh 21px 11vh;justify-content:center}.lead{font-size:clamp(42px,11.4vw,72px);line-height:.94}.manifest{font-size:clamp(57px,13.2vw,125px);line-height:.88;margin-top:clamp(44px,9vh,80px)}.end{font-size:clamp(32px,8.7vw,70px);line-height:.9;margin-top:clamp(23px,5vh,55px);white-space:normal;overflow-wrap:normal}.menu-trigger{display:flex;position:absolute;right:22px;top:24px;border:0;background:none;padding:0;width:30px;gap:6px;flex-direction:column;align-items:flex-end}.menu-trigger span{display:block;width:100%;height:2px;background:var(--teal)}.menu-trigger span:last-child{width:65%}.nav-mobile.open{display:flex;position:fixed;inset:72px 0 0;z-index:30;background:var(--paper);flex-direction:column;justify-content:center;padding:30px;gap:22px}.nav-mobile a{font:400 52px/1 Droid,sans-serif}}
