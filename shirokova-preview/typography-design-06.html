:root{--bg:#F8FAFA;--pale:#DDEFF0;--ink:#07516A;--sea:#21A9AC;--tint:#50A8AA;--deep:#06376B;--mid:#107080}*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}body{color:var(--ink);font-family:Arial,sans-serif}a{text-decoration:none;color:inherit}button{font:inherit}
.layout{display:grid;grid-template-columns:clamp(170px,14.6vw,224px) minmax(0,1fr);min-height:100svh}
.rail{position:sticky;top:0;height:100svh;border-right:1px solid var(--pale);display:flex;flex-direction:column;align-items:flex-start;padding:27px 23px 28px;background:var(--bg);z-index:3}
.logo{display:block;width:96px;height:auto;object-fit:contain}
.nav{margin:auto 0;display:flex;flex-direction:column;align-items:flex-start;gap:clamp(15px,2.9vh,32px)}.nav a{font:400 clamp(27px,2.5vw,39px)/1 Droid,sans-serif;transition:color .25s,transform .25s}.nav a:hover{color:var(--sea);transform:translateX(5px)}
.stage{min-width:0;min-height:100svh;position:relative;display:flex;align-items:center;overflow:hidden;background:var(--bg)}
.hero{width:100%;padding:clamp(45px,6vw,108px) clamp(31px,5vw,90px);min-height:min(900px,100svh);display:grid;grid-template-rows:auto auto auto auto;align-content:center;row-gap:clamp(17px,2.2vh,31px);position:relative}
.headline{margin:0;display:contents;font-weight:400}
.lead{font:400 clamp(48px,5.65vw,98px)/.92 Droid,sans-serif;color:var(--ink);max-width:95%;letter-spacing:.006em}
.lead .tail{color:var(--sea)}
.subject{display:flex;align-items:center;justify-content:flex-end;font:400 clamp(56px,7.6vw,139px)/.92 Droid,sans-serif;color:var(--sea);margin-top:clamp(3px,1vh,15px);letter-spacing:.01em;white-space:nowrap;position:relative}
.subject::before{content:'';width:clamp(38px,12%,165px);height:1px;background:var(--tint);margin-right:clamp(15px,3vw,51px);align-self:center}
.bridge{font:400 clamp(39px,4.5vw,80px)/1 Droid,sans-serif;color:var(--mid);margin-top:clamp(14px,2.5vh,44px);justify-self:start}
.conclusion{font:400 clamp(60px,7.35vw,136px)/.87 Droid,sans-serif;color:var(--ink);letter-spacing:-.003em;white-space:nowrap;position:relative;margin-top:clamp(1px,1vh,13px);transform-origin:left center}
.conclusion .sea{color:var(--sea)}
.conclusion::after{content:'';position:absolute;bottom:-.15em;right:0;width:16%;height:clamp(3px,.32vw,5px);background:var(--sea)}
.desktop-mark{position:absolute;left:clamp(31px,5vw,90px);bottom:clamp(20px,4vh,58px);width:12px;height:12px;background:var(--sea);border-radius:50%}
.menubtn,.mobile-menu{display:none}
@media(min-width:900px) and (max-width:1250px){.hero{padding-left:3vw;padding-right:3vw}.lead{font-size:5.45vw}.subject{font-size:7vw}.bridge{font-size:4.4vw}.conclusion{font-size:7.1vw}}
@media(max-width:899px){
.layout{display:block}.rail{height:72px;position:relative;border-right:0;border-bottom:1px solid var(--pale);padding:7px 20px;justify-content:center}.logo{width:83px}.nav{display:none}
.stage{min-height:calc(100svh - 72px);overflow:hidden}
.hero{min-height:calc(100svh - 72px);padding:clamp(25px,6.5vh,70px) 22px;display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:0}
.lead{font-size:clamp(47px,12.4vw,100px);line-height:.95;max-width:95%}
.subject{font-size:clamp(61px,15.3vw,120px);margin-top:clamp(35px,7vh,70px);align-self:flex-end;white-space:nowrap;line-height:.96}.subject::before{width:24px;margin-right:12px}
.bridge{font-size:clamp(49px,12.8vw,108px);margin-top:clamp(34px,7vh,70px);max-width:93%;line-height:.94}
.conclusion{font-size:clamp(43px,10.2vw,89px);line-height:.95;white-space:normal;overflow-wrap:anywhere;margin-top:clamp(31px,6vh,68px)}
.conclusion::after{bottom:-16px}.desktop-mark{bottom:21px;left:22px;width:7px;height:7px}
.menubtn{display:flex;position:absolute;right:22px;top:23px;width:35px;height:29px;background:none;border:0;z-index:10;flex-direction:column;align-items:flex-end;justify-content:center;gap:7px;padding:0}.menubtn i{width:29px;height:2px;background:var(--ink);display:block}.menubtn i:last-child{width:18px}
.mobile-menu.open{display:flex;position:fixed;inset:72px 0 0;z-index:20;background:var(--bg);flex-direction:column;justify-content:center;gap:clamp(24px,7vh,60px);padding:28px}.mobile-menu a{font:400 clamp(57px,17vw,118px)/.9 Droid,sans-serif}
}
@media(max-width:390px){.lead{font-size:12vw}.subject{font-size:15vw}.bridge{font-size:12vw}.conclusion{font-size:9.9vw}}
@media(prefers-reduced-motion:reduce){.nav a{transition:none}}
