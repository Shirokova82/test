const word=document.querySelector("#finalWord"),text=word.textContent;
word.textContent="";for(const char of Array.from(text)){let sp=document.createElement("span");sp.textContent=char;word.appendChild(sp)}
const first=document.querySelector(".first"),hand=document.querySelector(".script-line"),finish=document.querySelector(".finish"),chars=[...word.children];
let tl;
function fit(el,outer,min=22){const old=el.style.fontSize;el.style.fontSize="";let font=parseFloat(getComputedStyle(el).fontSize);const max=font;let width=outer.clientWidth;if(innerWidth>820)width=Math.min(width,outer.clientWidth); const measured=()=>{let r=document.createRange();r.selectNodeContents(el);return r.getBoundingClientRect().width};while(measured()>width-4&&font>min){font-=.5;el.style.fontSize=font+"px"}}
function layout(){fit(first,first.parentElement,25);fit(hand,hand.parentElement,30);fit(finish,finish.parentElement,26)}
function animate(){if(tl)tl.kill();gsap.set([first,hand],{clearProps:"all"});gsap.set(chars,{clearProps:"all"});
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
if(reduce)return;
tl=gsap.timeline();
tl.fromTo([first,hand],{yPercent:110},{yPercent:0,duration:1.05,stagger:0.35,ease:"power3.out"},0.3);
tl.fromTo(chars,{y:48,opacity:0},{y:0,opacity:1,duration:.62,stagger:.035,ease:"power3.out"},1.06)
}
let delay;window.addEventListener("resize",()=>{clearTimeout(delay);delay=setTimeout(()=>{if(tl)tl.progress(1);layout()},120)});
document.fonts.ready.then(()=>{layout();animate()});
})();
</script></body></html>
